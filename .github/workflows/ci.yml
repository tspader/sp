name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zig:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: x86_64-linux,  os: ubuntu-latest,    triples: x86_64-linux-none x86_64-linux-gnu x86_64-linux-musl }
          - { id: wasm,          os: ubuntu-latest,    triples: wasm32-wasi wasm32-freestanding }
          - { id: control,       os: ubuntu-latest,    triples: x86_64-linux-musl }
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ contains(matrix.triples, 'wasm32') && 'wasm32-wasi' || 'x86_64-linux-musl' }}
      TESTS: amalgamation meta sys atomic fs msvct sync mem http promptt
    steps:
      - uses: actions/checkout@v4
      - if: contains(matrix.triples, 'wasm32')
        uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: boonbane/spn-action@main
        with:
          version: latest
          cache: ${{ matrix.id != 'control' }}
      - shell: bash
        run: |
          spn --version
          for n in 1 2; do
            echo "> build $n"
            spn --json build --test --target $TARGET $TESTS > events-$n.jsonl
            jq -c 'select(.event == "build_summary") | .data' events-$n.jsonl
            jq -r 'select(.event == "target_build_passed" or .event == "link_passed") | [.event, .tid, (.data.source_file // .data.file_name)] | @tsv' events-$n.jsonl | head -40 || true
          done
      - if: "!contains(matrix.triples, 'wasm32')"
        shell: bash
        run: |
          for t in $TESTS; do
            echo "> $t"
            build/x86_64-linux-musl/debug/test/$t || exit 1
          done
      - if: contains(matrix.triples, 'wasm32')
        shell: bash
        run: |
          for t in $TESTS; do
            echo "> $t"
            wasmtime run --dir "$PWD" build/wasm32-wasi-musl/debug/test/$t.wasm || exit 1
          done
