name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: x86_64-linux,  os: ubuntu-latest,  targets: x86_64-linux-gnu x86_64-linux-musl x86_64-linux-none }
          - { id: aarch64-linux, os: ubuntu-latest,  targets: aarch64-linux-gnu aarch64-linux-musl aarch64-linux-none }
          - { id: macos,         os: macos-latest,   targets: aarch64-macos-apple }
          - { id: windows,       os: windows-latest, targets: x86_64-windows-gnu }
          - { id: wasm,          os: ubuntu-latest,  targets: wasm32-wasi-musl wasm32-freestanding-none }
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: boonbane/spn-action@main
        with:
          version: latest
      - if: matrix.id == 'wasm'
        uses: bytecodealliance/actions/wasmtime/setup@v1
      - if: matrix.id == 'x86_64-linux'
        run: sudo apt-get update && sudo apt-get install -y musl
      - run: spn build check
      - run: ./build/debug/check ${{ matrix.targets }}

  gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: boonbane/spn-action@main
        with:
          version: latest
      - run: spn build --toolchain gcc --sanitize undefined
      - run: spn test --toolchain gcc --sanitize undefined

  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: boonbane/spn-action@main
        with:
          version: latest
      - run: spn build --toolchain msvc
      - run: spn test --toolchain msvc

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, gcc, msvc]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          tag=${GITHUB_REF_NAME}
          mkdir -p release "$tag/sp"
          cp sp.h LICENSE "$tag/"
          cp sp/*.h "$tag/sp/"
          tar -czf "release/sp-$tag.tar.gz" "$tag"
          cp sp.h release/sp.h
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/sp.h
            release/sp-*.tar.gz
          generate_release_notes: true
