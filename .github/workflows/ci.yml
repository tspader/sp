name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zig:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: x86_64-linux,  os: ubuntu-latest,    triples: x86_64-linux-none x86_64-linux-gnu x86_64-linux-musl }
          - { id: wasm,          os: ubuntu-latest,    triples: wasm32-wasi wasm32-freestanding }
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: contains(matrix.triples, 'wasm32')
        uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: boonbane/spn-action@main
        with:
          version: latest
      - if: matrix.id == 'x86_64-linux'
        shell: bash
        run: |
          tests="amalgamation meta sys atomic fs msvct sync mem http promptt"
          spn build --test --target x86_64-linux-musl $tests
          for t in $tests; do
            echo "> $t"
            build/x86_64-linux-musl/debug/test/$t || exit 1
          done
      - if: contains(matrix.triples, 'wasm32')
        shell: bash
        run: |
          tests="amalgamation meta sys atomic fs msvct sync mem http promptt"
          spn build --test --target wasm32-wasi $tests
          for t in $tests; do
            echo "> $t"
            wasmtime run --dir "$PWD" build/wasm32-wasi-musl/debug/test/$t.wasm || exit 1
          done
      - run: exit 1
