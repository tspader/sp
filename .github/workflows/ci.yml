name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zig:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: x86_64-linux,  os: ubuntu-latest,    triples: x86_64-linux-none x86_64-linux-gnu x86_64-linux-musl }
          - { id: wasm,          os: ubuntu-latest,    triples: wasm32-wasi wasm32-freestanding }
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ contains(matrix.triples, 'wasm32') && 'wasm32-wasi' || 'x86_64-linux-musl' }}
      TESTS: amalgamation meta sys atomic fs msvct sync mem http promptt
    steps:
      - uses: actions/checkout@v4
      - if: contains(matrix.triples, 'wasm32')
        uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: boonbane/spn-action@main
        with:
          version: latest
      - shell: bash
        run: |
          spn --version
          export LC_ALL=C
          store="$SPN_STORAGE_DIR/store"
          snap="$RUNNER_TEMP/snap"
          mkdir -p "$snap"
          empty="$store/blob/af1349b9f5f9a1a6a0404dea36dcc9499bcb25c9adc112b7cc9a93cae41f3262"
          list() {
            if [ "$1" = blob ]; then
              (cd "$store/blob" && find . -mindepth 2 -printf '%P %i\n' | sort)
            else
              (cd "$store/$1" && ls -i | awk '{ print $2, $1 }' | sort)
            fi
          }
          echo "empty blob: $(ls "$empty" | wc -l) names, $(ls "$empty" | grep -c '^log.txt$' || true) log.txt"
          ls "$empty" | head -12 || true
          cp -a "$store/weak" "$store/strong" "$snap/"
          for kind in weak strong blob; do
            echo "$kind: $(ls "$store/$kind" | wc -l) entries"
            list $kind > "$snap/$kind.before"
          done
          for n in 1 2; do
            echo "> build $n"
            spn --json build --test --target $TARGET $TESTS > "$RUNNER_TEMP/events-$n.jsonl"
            jq -c 'select(.event == "build_summary") | .data' "$RUNNER_TEMP/events-$n.jsonl"
            jq -r 'select(.event == "target_build_passed" or .event == "link_passed") | [.event, .tid, (.data.source_file // .data.file_name)] | @tsv' "$RUNNER_TEMP/events-$n.jsonl" | head -40 || true
            for kind in weak strong blob; do
              list $kind > "$snap/$kind.after"
              comm -13 "$snap/$kind.before" "$snap/$kind.after" | awk '{ print $1 }' > "$snap/$kind.written"
              comm -23 <(awk '{ print $1 }' "$snap/$kind.before") <(awk '{ print $1 }' "$snap/$kind.after") | sed "s#^#gone $kind/#"
              while read -r name; do
                if [ "$kind" = blob ]; then
                  grep -q "^$name " "$snap/$kind.before" && echo "rewritten blob/$name" || echo "new blob/$name"
                elif [ ! -e "$snap/$kind/$name" ]; then
                  echo "new $kind/$name"
                  head -c 3000 "$store/$kind/$name"
                elif cmp -s "$snap/$kind/$name" "$store/$kind/$name"; then
                  echo "rewritten identical $kind/$name"
                  head -c 3000 "$store/$kind/$name"
                else
                  echo "rewritten changed $kind/$name"
                  diff "$snap/$kind/$name" "$store/$kind/$name" | head -80 || true
                fi
              done < "$snap/$kind.written"
              cp "$snap/$kind.after" "$snap/$kind.before"
            done
            rm -rf "$snap/weak" "$snap/strong"
            cp -a "$store/weak" "$store/strong" "$snap/"
          done
      - if: "!contains(matrix.triples, 'wasm32')"
        shell: bash
        run: |
          for t in $TESTS; do
            echo "> $t"
            build/x86_64-linux-musl/debug/test/$t || exit 1
          done
      - if: contains(matrix.triples, 'wasm32')
        shell: bash
        run: |
          for t in $TESTS; do
            echo "> $t"
            wasmtime run --dir "$PWD" build/wasm32-wasi-musl/debug/test/$t.wasm || exit 1
          done
