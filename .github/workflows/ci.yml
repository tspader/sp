name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zig:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: x86_64-linux,  os: ubuntu-latest,    triples: x86_64-linux-none x86_64-linux-gnu x86_64-linux-musl }
          - { id: wasm,          os: ubuntu-latest,    triples: wasm32-wasi wasm32-freestanding }
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.id == 'wasm' && 'wasm32-wasi' || 'x86_64-linux-musl' }}
      EXTRA: ${{ matrix.id == 'wasm' && 'x86_64-linux-musl' || 'x86_64-linux-gnu' }}
      TESTS: amalgamation meta sys atomic fs msvct sync mem http promptt
    steps:
      - uses: actions/checkout@v4
      - uses: boonbane/spn-action@main
        with:
          version: latest
      - shell: bash
        run: |
          empty="$SPN_STORAGE_DIR/store/blob/af1349b9f5f9a1a6a0404dea36dcc9499bcb25c9adc112b7cc9a93cae41f3262"
          build() {
            spn --json build --test --target $1 $2 > "$RUNNER_TEMP/events.jsonl"
            jq -c 'select(.event == "build_summary") | .data | {hits, misses, total}' "$RUNNER_TEMP/events.jsonl"
            jq -r 'select(.event == "target_build_passed" or .event == "link_passed") | (.data.source_file // .data.file_name)' "$RUNNER_TEMP/events.jsonl" | head -12 || true
          }
          ls "$empty"
          echo "> $TARGET"
          build $TARGET "$TESTS"
          echo "> $EXTRA"
          build $EXTRA atomic
          jq -r '.event' "$RUNNER_TEMP/events.jsonl" | sort | uniq -c
          ls "$empty"

  fixture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: boonbane/spn-action@store/blob-files
        with:
          version: latest
      - shell: bash
        run: |
          for kind in blob strong weak; do
            echo "$kind: $(find "$SPN_STORAGE_DIR/store/$kind" -type f 2>/dev/null | wc -l)"
          done
          spn --json build --test atomic > "$RUNNER_TEMP/events.jsonl"
          jq -c 'select(.event == "build_summary") | .data | {hits, misses, total}' "$RUNNER_TEMP/events.jsonl"
