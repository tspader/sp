[package]
name = "sp"
version = "0.1.0"
include = ["."]
define = [
  { value = "SP_FREESTANDING", when = { os = "linux", abi = "none" } },
]
system_deps = [
  { lib = "ws2_32", when = { os = "windows" } },
  { lib = "crypt32", when = { os = "windows" } },
  { lib = "advapi32", when = { os = "windows" } },
  { lib = "bcrypt", when = { os = "windows" } },
]

[profile.default]
standard = "c99"

[profile.sanitizer]
sanitize = ["address", "undefined"]

[profile.tsan]
sanitize = ["thread"]

[[test]]
name = "amalgamation"
source = [
  "test/main.c",
  "test/atomic.c",
  "test/mem/uninitialized.c",
  "test/sys/sys.c", "test/sys/open.c", "test/sys/path.c", "test/sys/futex.c",
  "test/sys/fd.c", "test/sys/fd_path.c", "test/sys/nanosleep.c", "test/sys/timestamps.c", "test/sys/set_times.c", "test/sys/perms.c", "test/sys/self_path.c",
  "test/sys/transfer.c", "test/sys/readlink.c", "test/sys/rename.c", "test/sys/unlink.c",
  "test/sys/copy_link.c", "test/sys/reparse.c",
  "test/sys/sync.c",
  "test/sys/inherit.c",
  "test/sys/*/*.c",
  "test/fs/**/*.c",
  "test/str/**/*.c",
  "test/sync/**/*.c",
  "test/msvc/*.c",
  "test/http/*.c",
  "test/prompt/*.c",
]
include = [".", "test/fs"]

[[test]]
name = "meta"
source = ["test/test/*.c"]

[[test]]
name = "utest"
source = ["test/amalg.c"]
include = ["test", "test/tools"]

[[test]]
name = "cpp"
source = [{ path = "test/amalg.cpp", when = { driver = { not = "msvc" } } }]
include = ["test", "test/tools"]
cxx = { standard = "c++11" }

[[test]]
name = "tls"
source = [
  { path = "test/main.c", when = { os = { not = "wasi" }, abi = { not = "none" } } },
  { path = "test/http/tls/*.c", when = { os = { not = "wasi" }, abi = { not = "none" } } },
]
define = [
  "SP_TLS_WITH_MBEDTLS",
  { value = "SP_TLS_MACOS_SECTRUST", when = { os = "macos" } },
  { value = "SP_TLS_MBEDTLS_SINGLE_THREAD", when = { os = "windows" } },
]
system_deps = [
  { framework = "Security", when = { os = "macos" } },
  { framework = "CoreFoundation", when = { os = "macos" } },
]

[[lib]]
name = "sp"
kinds = ["shared"]
source = [{ path = "test/tools/linkage/lib-impl.c", when = { os = { not = "wasi" }, abi = { not = "none" } } }]
define = ["SP_SHARED_LIB"]

[[test]]
name = "linkage"
source = [{ path = "test/tools/linkage/main-decl.c", when = { os = { not = "wasi" }, abi = { not = "none" } } }]
define = ["SP_SHARED_LIB"]
deps = ["sp"]

[deps.test]
mbedtls = { path = "tools/spn/mbedtls", when = { os = { not = "wasi" }, abi = { not = "none" } } }

[[example]]
name = "app"
source = ["example/app.c"]

