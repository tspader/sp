[package]
name = "sp"
version = "0.1.0"
include = ["."]
system_deps = [
  { lib = "ws2_32", when = { os = "windows" } },
  { lib = "crypt32", when = { os = "windows" } },
  { lib = "advapi32", when = { os = "windows" } },
  { lib = "bcrypt", when = { os = "windows" } },
]

[[test]]
name = "amalgamation"
source = [
  "test/main.c",
  "test/test/axis.c", "test/test/filter.c", "test/test/matrix.c",
  "test/test/resolve.c", "test/test/sweep.c", "test/test/tracking.c",
  "test/sys/sys.c", "test/sys/open.c", "test/sys/path.c", "test/sys/iter.c", "test/sys/futex.c",
  "test/sys/fd.c", "test/sys/nanosleep.c", "test/sys/timestamps.c", "test/sys/self_path.c",
  "test/sys/pipe/data.c", "test/sys/pipe/blocking.c", "test/sys/transfer.c",
  "test/sys/socket/data.c", "test/sys/socket/listen.c", "test/sys/socket/desc.c",
  "test/sys/tty/contract.c", "test/sys/tty/mode.c", "test/sys/vtable.c",
  "test/sys/wait/event.c", "test/sys/wait/wait.c",
  "test/sys/inherit.c",
  "test/fs/iter/os.c", "test/fs/iter/iter.c", "test/fs/wtf8/*.c",
  "test/fs/*.c", "test/fs/windows/nt_path.c",
  "test/mem/uninitialized.c",
  "test/atomic.c",
  "test/sync/*.c", "test/sync/os/*.c"
]

[[test]]
name = "meta"
source = ["test/test/*.c"]

[[test]]
name = "sys"
source = [
  "test/main.c",
  "test/sys/sys.c", "test/sys/open.c", "test/sys/path.c", "test/sys/iter.c", "test/sys/futex.c",
  "test/sys/fd.c", "test/sys/nanosleep.c", "test/sys/timestamps.c", "test/sys/self_path.c",
  "test/sys/pipe/data.c", "test/sys/pipe/blocking.c", "test/sys/transfer.c",
  "test/sys/socket/data.c", "test/sys/socket/listen.c", "test/sys/socket/desc.c",
  "test/sys/tty/contract.c", "test/sys/tty/mode.c", "test/sys/vtable.c",
  "test/sys/wait/event.c", "test/sys/wait/wait.c",
  "test/sys/inherit.c"
]

[[test]]
name = "atomic"
source = ["test/main.c", "test/atomic.c"]

[[test]]
name = "fs"
source = ["test/main.c", "test/fs/iter/iter.c", "test/fs/iter/os.c", "test/fs/wtf8/*.c", "test/fs/*.c", "test/fs/windows/nt_path.c"]

[[test]]
name = "sync"
source = ["test/main.c", "test/sync/*.c", "test/sync/os/*.c"]

[[test]]
name = "mem"
source = ["test/main.c", "test/mem/uninitialized.c"]

[[test]]
name = "http"
source = [
  "test/main.c",
  "test/http/*.c",
]

[[test]]
name = "tls"
source = [
  "test/main.c",
  "test/http/tls/*.c",
]
deps = ["mbedtls"]
define = [
  "SP_TLS_WITH_MBEDTLS",
  { value = "SP_TLS_MACOS_SECTRUST", when = { os = "macos" } },
  { value = "SP_TLS_MBEDTLS_SINGLE_THREAD", when = { os = "windows" } },
]
macos = { frameworks = ["Security", "CoreFoundation"] }

[deps.test]
mbedtls = "3.6.6"

[[bin]]
name = "zero_copy"
source = ["example/zero_copy.c"]

[profile.sanitizer]
linkage = "shared"
sanitize = ["address", "undefined"]

[profile.tsan]
linkage = "shared"
sanitize = ["thread"]

[[toolchain]]
name = "clang"
compiler = "clang"
linker = "ld"
archiver = "ar"
driver = "clang"
