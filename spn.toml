[package]
name = "sp"
version = "0.1.0"
include = ["."]
system_deps = [
  { lib = "ws2_32", when = { os = "windows" } },
  { lib = "crypt32", when = { os = "windows" } },
  { lib = "advapi32", when = { os = "windows" } },
  { lib = "bcrypt", when = { os = "windows" } },
]

[[test]]
name = "amalgamation"
source = [
  "test/main.c",
  "test/atomic.c",
  "test/mem/uninitialized.c",
  "test/sys/sys.c", "test/sys/open.c", "test/sys/path.c", "test/sys/futex.c",
  "test/sys/fd.c", "test/sys/fd_path.c", "test/sys/nanosleep.c", "test/sys/timestamps.c", "test/sys/set_times.c", "test/sys/perms.c", "test/sys/self_path.c",
  "test/sys/transfer.c", "test/sys/readlink.c", "test/sys/rename.c", "test/sys/unlink.c",
  "test/sys/copy_link.c", "test/sys/reparse.c",
  "test/sys/sync.c",
  "test/sys/inherit.c",
  "test/sys/*/*.c",
  "test/fs/**/*.c",
  "test/str/**/*.c",
  "test/sync/**/*.c",
  "test/msvc/*.c",
  "test/http/*.c",
  "test/prompt/*.c",
]
include = [".", "test/fs"]

[[test]]
name = "meta"
source = ["test/test/*.c"]

[[test]]
name = "tls"
source = [
  "test/main.c",
  "test/http/tls/*.c",
]
define = [
  "SP_TLS_WITH_MBEDTLS",
  { value = "SP_TLS_MACOS_SECTRUST", when = { os = "macos" } },
  { value = "SP_TLS_MBEDTLS_SINGLE_THREAD", when = { os = "windows" } },
]
system_deps = [
  { framework = "Security", when = { os = "macos" } },
  { framework = "CoreFoundation", when = { os = "macos" } },
]

[[lib]]
name = "sp"
kinds = ["shared"]
source = ["test/tools/linkage/lib-impl.c"]
define = ["SP_SHARED_LIB"]

[[test]]
name = "linkage"
source = ["test/tools/linkage/main-decl.c"]
define = ["SP_SHARED_LIB"]
deps = ["sp"]

[deps.test]
mbedtls = { path = "tools/spn/mbedtls", when = { os = { not = "wasi" } } }

[[example]]
name = "zero_copy"
source = ["example/zero_copy.c"]

[[example]]
name = "msvc"
source = ["example/msvc.c"]

[[example]]
name = "prompt"
source = ["example/prompt.c"]

[[example]]
name = "prompt_fancy"
source = ["example/prompt_fancy.c"]

[[example]]
name = "cargo"
source = ["example/cargo.c"]

[profile.sanitizer]
sanitize = ["address", "undefined"]

[profile.tsan]
sanitize = ["thread"]

[[toolchain]]
name = "clang"
compiler = "clang"
linker = "ld"
archiver = "ar"
driver = "clang"
