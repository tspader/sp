[package]
name = "sp"
version = "0.1.0"
include = ["."]

[[test]]
name = "amalgamation"
source = [
  "test/main.c",
  "test/test/*.c",
  "test/sys/sys.c", "test/sys/open.c", "test/sys/iter.c", "test/sys/futex.c",
  "test/sys/pipe/data.c", "test/sys/pipe/blocking.c", "test/sys/transfer.c",
  "test/sys/socket/data.c", "test/sys/socket/listen.c", "test/sys/socket/desc.c",
  "test/sys/tty/contract.c", "test/sys/tty/mode.c", "test/sys/vtable.c",
  "test/sys/wait/event.c", "test/sys/wait/wait.c",
  "test/sys/inherit.c",
  "test/fs/iter/os.c", "test/fs/iter/iter.c",
  "test/mem/uninitialized.c",
  "test/atomic.c",
  "test/sync/*.c", "test/sync/os/*.c"
]

[[test]]
name = "meta"
source = ["test/main.c", "test/test/*.c", "test/test/wire/*.c"]

[[test]]
name = "sys"
source = [
  "test/main.c",
  "test/sys/sys.c", "test/sys/open.c", "test/sys/iter.c", "test/sys/futex.c",
  "test/sys/pipe/data.c", "test/sys/pipe/blocking.c", "test/sys/transfer.c",
  "test/sys/socket/data.c", "test/sys/socket/listen.c", "test/sys/socket/desc.c",
  "test/sys/tty/contract.c", "test/sys/tty/mode.c", "test/sys/vtable.c",
  "test/sys/wait/event.c", "test/sys/wait/wait.c",
  "test/sys/inherit.c"
]

[[test]]
name = "atomic"
source = ["test/main.c", "test/atomic.c"]

[[test]]
name = "fs"
source = ["test/main.c", "test/fs/iter/iter.c", "test/fs/iter/os.c"]

[[test]]
name = "sync"
source = ["test/main.c", "test/sync/*.c", "test/sync/os/*.c"]

[[test]]
name = "mem"
source = ["test/main.c", "test/mem/uninitialized.c"]

[[bin]]
name = "zero_copy"
source = ["example/zero_copy.c"]
